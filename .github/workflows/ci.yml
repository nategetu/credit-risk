name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Generate synthetic data
        run: python src/generate_synthetic.py

      - name: Run full pipeline (validation + train + eval gates)
        run: python src/pipeline.py
        # pipeline.py exits nonzero if AUC or calibration gates fail,
        # which fails this CI step and blocks the merge/deploy.

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: reports/pipeline_metrics.json
          if-no-files-found: ignore
